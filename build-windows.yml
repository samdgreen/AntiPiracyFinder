name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - shell: cmd
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "AntiPiracyReporter" --hidden-import openpyxl --hidden-import pyperclip app.py
      - uses: actions/upload-artifact@v4
        with:
          name: AntiPiracyReporter-Windows
          path: dist/AntiPiracyReporter.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AntiPiracyReporter.exe
